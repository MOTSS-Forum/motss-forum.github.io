baseURL = 'https://motss.cc/'
languageCode = 'zh-CN'
defaultContentLanguage = 'zh'
title = '酷儿论坛 | MOTSS'
theme = 'motsslib'

enableGitInfo = true
sectionPagesMenu = 'main'
paginate= 12

[permalinks]
  academic = '/:section/:slug/'
  article = '/:section/:slug/'
  news = '/:section/:slug/'
  event = '/:sections/:slug/'

[mediaTypes.'text/redirects']
  delimiter = ''

[outputFormats.redirects]
  baseName = '_redirects'
  isPlainText = true
  mediaType = 'text/redirects'
  root = true

[outputs]
  home = ['HTML', 'RSS', 'redirects']

# A URL or build change alone does not change an article's editorial date.
[frontmatter]
  lastmod = ['lastmod', 'date', 'publishDate']

[related]
  includeNewer = true
  threshold = 80
  toLower = true
  [[related.indices]]
    name = 'tags'
    weight = 100

[markup.goldmark.renderer]
unsafe= true

[[menu.static]]
  name = '捐赠'
  pageRef = '/support'
  weight = 10

[params]
  copyright = "[MOTSS Forum](https://motss.cc/)"
  description = "酷儿论坛为杭州高校性少数人群营造一个多元、健康、平等的环境，促进自我认同与社会认可。"
  title = "酷儿论坛"
  defaultAuthor = "苦瓜瓜"
  resourceUrlPrefix = "https://motss-forum.github.io/archives/wechat/html/图片/酷儿论坛"
  footer = '<a href="{{< relref "/" >}}"><img src="/34d81d63fc27cfbe190bbcb3c6c5412c65b04086.png" height="20px"/><span>·</span><strong>多元 × 健康 × 平等</strong></a>'

  dateFormat = "Jan 02, 2006"
  favicon = "favicon.png"
